$kind: http-request
name: Photos in BBox
method: GET
url: '{{base_url}}{{api_prefix}}/photos/bbox'
headers:
  - key: X-API-Key
    value: '{{api_key}}'
order: 2000
queryParams:
  - key: min_lng
    value: '-105'
  - key: min_lat
    value: '31'
  - key: max_lng
    value: '-104'
  - key: max_lat
    value: '32'
  - key: limit
    value: '5'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has photos array and total", function () {
          var data = pm.response.json();
          pm.expect(data).to.have.property("photos").that.is.an("array");
          pm.expect(data).to.have.property("total");
      });
