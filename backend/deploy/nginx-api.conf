# nginx site config for api.outcropanalog.com
#
# Tracked here so it stops existing only as an untracked file on one instance.
# Apply with:
#
#   sudo cp backend/deploy/nginx-api.conf /etc/nginx/sites-available/api.outcropanalog.com
#   sudo ln -sf /etc/nginx/sites-available/api.outcropanalog.com /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/cache/nginx/tiles && sudo chown -R www-data:www-data /var/cache/nginx
#   sudo nginx -t && sudo systemctl reload nginx
#
# The ssl_* lines are managed by Certbot. If Certbot rewrites this file on
# renewal, copy its changes back here rather than letting the two diverge.

# Tile cache. Tiles are immutable and versioned, so entries are only retired by
# a TILE_VERSION bump or by falling out of the cache.
#
# max_size is deliberately modest: the instance root volume is 7G and was 83%
# full when this was written. At roughly 25 KB a tile, 400m holds about 16,000
# tiles -- more than the four raster layers need across z6-z14 for the study
# area. Raise it after the volume is grown.
proxy_cache_path /var/cache/nginx/tiles
                 levels=1:2
                 keys_zone=tiles:10m
                 max_size=400m
                 inactive=30d
                 use_temp_path=off;

server {
    listen 443 ssl; # managed by Certbot
    server_name api.outcropanalog.com;

    ssl_certificate /etc/letsencrypt/live/api.outcropanalog.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.outcropanalog.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # ------------------------------------------------------------------
    # Tiles. Cached on disk so a tile is rendered once and then served
    # without waking Python. A cold render is 0.4-0.9s and hits the
    # database; a cached hit is about a millisecond and does neither.
    # ------------------------------------------------------------------
    location /api/v1/tiles/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache tiles;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Fallbacks only. The application sends Cache-Control itself --
        # immutable for tiles, 5 minutes for the manifest -- and nginx
        # honours that in preference to these.
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;

        # A fresh map view asks for many tiles at once. Without this, several
        # simultaneous requests for the same tile each render it.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;

        # Keep serving a stale tile while a new one renders, rather than
        # making the viewer wait on a re-render.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        proxy_read_timeout 60s;

        # HIT / MISS / EXPIRED, so cache behaviour is checkable from outside.
        add_header X-Tile-Cache $upstream_cache_status always;

        add_header 'Access-Control-Allow-Origin' 'https://outcropanalog.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ------------------------------------------------------------------
    # Everything else: uncached passthrough.
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx owns CORS. The application's CORSMiddleware is disabled: two
        # Access-Control-Allow-Origin headers make browsers reject the
        # response outright.
        add_header 'Access-Control-Allow-Origin' 'https://outcropanalog.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        # `always` means these headers are present on this 204 too, so
        # preflight is answered correctly.
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

server {
    listen 80;
    server_name api.outcropanalog.com;

    if ($host = api.outcropanalog.com) {
        return 301 https://$host$request_uri;
    }
}
